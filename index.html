<style>
/* VOICE: a fireside storyteller — warm, a little eerie, never jokey.
   IDEA: an illuminated adventurer's journal lit by one lantern.
   PICTURE: a layered night scene of the current place, with foes appearing in it.
   COLOUR and TYPE: deep forest night, parchment ink, one lantern-flame orange; IM Fell English SC + Alegreya.
   LAYOUT: title, scene, vitals, journal, then large action buttons — one column, thumb-friendly. */
:root{color-scheme:dark;--bg:#0e1b17;--panel:#14261f;--line:#2a4237;--ink:#efe6d2;--dim:#b9b09a;--flame:#ff7a3d;--hp:#d9453b;--mp:#5aa6d6;--xp:#e2b94a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Alegreya,Georgia,serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(4vw,14px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(4vw,14px,env(safe-area-inset-left))}
h1{font:400 clamp(28px,6vw,42px)/1.05 "IM Fell English SC",Georgia,serif;margin:6px 0 12px;text-wrap:balance}
h1 span{color:var(--flame)}
.scene{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:2/1;max-height:42vh;width:100%;background:#0a1512}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.place{position:absolute;left:14px;bottom:10px;font:400 22px/1.1 "IM Fell English SC",serif;text-shadow:0 2px 8px #000}
.foe{position:absolute;right:12px;top:10px;background:#0e1b17d9;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:150px;font-size:15px}
.vit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.bar{font-size:14px;color:var(--dim)}
.bar b{color:var(--ink);font-weight:600}
.track{height:8px;background:#0a1512;border-radius:5px;overflow:hidden;margin-top:3px;border:1px solid var(--line)}
.track i{display:block;height:100%;transition:width .35s}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--dim);margin-bottom:10px}
.meta b{color:var(--ink)}
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;height:clamp(180px,30vh,300px);overflow-y:auto}
.log p{margin:0 0 8px}
.log p:last-child{color:var(--ink)}
.log p:not(:last-child){color:var(--dim)}
.log .hit{color:#f0a08f}.log .good{color:#e9cf7d}.log .sys{font-style:italic}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
button{font:600 16px/1.2 Alegreya,serif;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#1b3229;color:var(--ink);cursor:pointer;text-align:left}
button:hover{background:#224034}
button:focus-visible,input:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
button.main{background:var(--flame);color:#1a0d05;border-color:var(--flame)}
button:disabled{opacity:.45;cursor:not-allowed}
button small{display:block;font-weight:400;font-size:13px;opacity:.85}
.intro p{margin:0 0 14px}.intro p:first-child::first-letter{font:400 3.2em/0.8 "IM Fell English SC",serif;float:left;margin:6px 8px 0 0;color:var(--flame)}.intro{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}.intro .who{color:var(--dim);font-style:italic}
.create label{display:block;margin:8px 0 4px;color:var(--dim)}
.create input{width:100%;font:16px Alegreya,serif;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0a1512;color:var(--ink)}
.classes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.classes button{min-height:110px}
.classes button[aria-pressed=true]{border-color:var(--flame);box-shadow:inset 0 0 0 1px var(--flame)}
.foot{margin-top:18px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--dim)}
.help{position:fixed;inset:0;background:#050b09cc;display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:9;overflow-y:auto}
.help[hidden]{display:none}.scroll{overflow-x:auto}
.help>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:700px;width:100%;padding:18px 20px 24px;margin:auto 0}
.help h2{font:400 30px/1.1 "IM Fell English SC",serif;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.help h3{font:400 21px/1.2 "IM Fell English SC",serif;color:var(--flame);margin:20px 0 6px}
.help p,.help li{font-size:16px}.help ul,.help ol{padding-left:20px;margin:6px 0}
.help table{width:100%;border-collapse:collapse;font-size:15px}
.help th,.help td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.help th{color:var(--dim);font-weight:600}.help td.n,.help th.n{text-align:right;white-space:nowrap}
.help h2 button{background:none;min-height:44px}
.foot .btns{display:flex;gap:8px}
.foot button{min-height:44px;font-size:14px;background:none}
@media(max-width:600px){.classes{grid-template-columns:1fr}.classes button{min-height:64px}.vit{gap:6px}.foe{min-width:120px;font-size:13px}.place{font-size:18px}}
@media(prefers-reduced-motion:reduce){.track i{transition:none}.flick{animation:none!important}}
@keyframes flick{0%,100%{opacity:.85}50%{opacity:1}}
.flick{animation:flick 2.4s ease-in-out infinite}
</style>
</head>

const EMBERS=8;

let S=null, mode='door', chosen='warrior', log=[], trade=null;

function save(){try{localStorage.setItem(KEY,JSON.stringify({S,mode,log:log.slice(-40)}))}catch(e){}}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(!d||!d.S)return false;S=d.S;mode=d.mode;log=d.log||[];}catch(e){return false}
  S.embers=S.embers||0;S.beaten=S.beaten||{};S.inv.greater=S.inv.greater||0;S.inv.elixir=S.inv.elixir||0;S.inv.deep=S.inv.deep||0;
  if(S.flags.done&&!S.flags.nine){delete S.flags.done;delete S.beaten.king;if(mode==='won')mode='explore';S.loc='village';
    say('Your story is not over. As the villagers celebrate, the lantern flickers and dims. The Hollow King you struck down was only his shadow, and five embers of Aldra\'s flame are still missing. Speak to Elder Maren.','sys');}
  if(S.loc==='heart'&&S.embers<EMBERS)S.loc='forest';
  S.flags.nine=1;
  if(S.flags.won){delete S.flags.won;S.embers=Math.max(S.embers,1);S.beaten.abbot=1;if(mode==='won')mode='explore';
    say('The story is longer than it seemed. The creature you defeated in the chapel was only a servant, and the flame you carried home was a single ember. New lands have opened beyond Whisperwood. Speak to Elder Maren.','sys');}
  if(S.foe&&!FOES[S.foe.key]){S.foe=null;mode='explore';}
  return true;
}
function say(t,c=''){log.push({t,c});if(log.length>60)log.shift()}

function newHero(name,cls){
  const c=CLASSES[cls];
  S={name:name||'Wanderer',cls,lvl:1,xp:0,hp:c.hp,maxHp:c.hp,mp:c.mp,maxMp:c.mp,atk:c.atk,def:c.def,gold:15,
     inv:{potion:2,ether:1,greater:0,elixir:0,deep:0},gear:{},loc:'village',flags:{nine:1},caveCount:0,foe:null,turn:0,embers:0,beaten:{},tablet:0};
  log=[];
  if(trade==='garb'){S.flags.garb=true;S.inv.potion++;
    say(`Dressed in plain village wool, ${esc(S.name)} the ${c.label} walks into the square of Hollowmere. Nobody gives you a second glance. Maren has also slipped a Healing Draught into your pocket. Above you, the great lantern hangs cold and empty.`);}
  else{S.tablet=3;S.flags.stranger=true;
    say(`${esc(S.name)} the ${c.label} walks into the square of Hollowmere in strange clothes, tablet in hand. Villagers stop and stare, and a few make the sign against evil. Above you, the great lantern hangs cold and empty.`);
    say('The tablet\'s battery shows 3 bars. In a fight, its sudden glow could dazzle an enemy, but it will not last forever.','sys');}
  say('Ask Elder Maren what happened. She knows the old story better than anyone.','sys');
  mode='explore';
}

/* ---------- scene ---------- */
function scene(){
  if(S&&S.loc==='jail'){
    $('scene').innerHTML=`<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

function forgeTip(none=''){
  const avail=SHOP.filter(it=>it.once&&it.req<=S.embers&&!S.gear[it.id]),own=k=>Math.max(0,...SHOP.filter(i=>S.gear[i.id]&&i[k]).map(i=>i[k])),best=k=>avail.filter(i=>i[k]>own(k)).sort((x,y)=>y[k]-x[k])[0];
  const left=[best('atk'),best('def')].filter(Boolean).map(it=>'the '+it.name);
  if(!left.length)return none;
  const list=left.length>1?left.slice(0,-1).join(', ')+' and '+left[left.length-1]:left[0];
  return ` "Brannoc has ${list} at his forge. You should get ${left.length>1?'them':'it'} before you go."`;
}
function talk(){
  const e=S.embers;
  if(!S.flags.quest){S.flags.quest=true;
    say('Elder Maren grips your arm. "You know the old story? Aldra\'s lantern and the Hollow King? Children think it is only a bedtime tale. It is not."');
    say('"Aldra\'s seal has weakened over the centuries. Three nights ago a crowned shadow rose out of the Sunken Chapel and stole her flame from our lantern. Can you hear the wood? Those are the voices of everyone he has taken. Every night without the flame, the trees move closer."');
    say('"The chapel has been locked for a century. The last keeper fled into Mossdeep Cave. If the key survives, it is there. Grow strong first, child."','sys');
    if(S.flags.stranger&&!S.flags.mob){S.flags.mob=1;startMob();}}
  else if(S.flags.done)say('"The lantern has never burned so bright," Maren says, smiling. "Aldra would be proud of you."');
  else if(e===0&&!S.flags.key)say('"Search Mossdeep Cave, beyond Whisperwood."'+forgeTip(' "You look well equipped, at least. Keep a few draughts on you."'));
  else if(e===0)say(`"You have the key! The chapel lies past Whisperwood. ${S.lvl<4?'But you are not ready. Reach level 4 at least."':'Go, and may the old light guide you."'}`+forgeTip());
  else if(e<EMBERS){
    if(e===1)say('Maren stares at the weak little ember. "So that is his game. Orlen split Aldra\'s flame into eight embers and gave each to a servant, so no one could take it back in one stroke. He has fled to the Heartwood, the grove where he made his bargain, to regrow his strength."');
    const R=ROUNDS[e];say(NEXT[e]+(S.lvl<R.blvl?` "I would reach level ${R.blvl} before you face that one."`:'')+forgeTip(e>=6?' "I see you already carry Brannoc\'s finest work. Good."':''),e===1?'sys':'');}
  else say(`"The path to the Heartwood is open. Orlen waits at its centre. ${S.lvl<20?'He is far stronger than anything you have faced. I would reach level 20 first."':'You are as ready as anyone has ever been. End this."'}`+' "Carry as many Elixirs of Aldra as you can afford. Eight would not be too many."'+forgeTip());
}

const POOLS={forest:()=>['wolf','goblin',S.lvl>1?'spider':'wolf'],cave:()=>S.lvl>=2?['bat','spider','skeleton']:['bat','bat','spider'],

  wastes:()=>['scorpion','sandwraith','glassgolem'],spire:()=>['briar','thornsentinel','acolyte'],heart:()=>['thorn','shade','treant']};
function explore(){
  const l=S.loc,r=Math.random();
  if(l==='cave'){S.caveCount++;
    if(!S.flags.key&&S.caveCount>=3){S.flags.pendingKey=true;say('Deep in the cave, a skeleton clutches a rusted iron key. Its jaw clacks open as you approach.');return fight('skeleton');}}
  const odds={forest:.55,cave:.65}[l]||.7;
  if(r<odds)return fight(pick(POOLS[l]()));
  if(l==='forest'){if(Math.random()<.55){const g=rnd(2,8);S.gold+=g;say(`You find a dropped coin purse in the leaf litter: ${g} gold.`,'good');}
    else{S.inv.potion++;say('You gather silverleaf and brew a Healing Draught.','good');}return;}
  const loot={cave:[4,12,"Old miners' coins glint in a puddle"],ruins:[10,20,'Among the pews you find an offering box'],moor:[15,30,'A drowned traveller\'s satchel floats in the bog'],
    peaks:[20,40,'A frozen climber still grips his coin pouch'],barrows:[40,70,'A burial urn is full of old coins'],coast:[50,90,'A sea chest has washed up on the sand'],
    mines:[60,110,'A forgotten miner\'s strongbox'],wastes:[70,130,'A half-buried caravan still holds its cargo'],spire:[80,150,'Tribute is piled on a thorny step'],heart:[90,160,'Gold offerings lie tangled in the roots']}[l];
  const g=rnd(loot[0],loot[1]);S.gold+=g;let extra='';
  if(l==='ruins'){S.inv.ether++;extra=' and a vial of Blue Ether';}
  if(l==='moor'||l==='peaks'){S.inv.greater++;extra=' and a Greater Draught';}
  if(['barrows','coast','mines'].includes(l)){S.inv.greater++;extra=' and a Greater Draught';}
  if(['wastes','spire','heart'].includes(l)){S.inv.elixir++;extra=' and an Elixir of Aldra';}
  say(`${loot[2]}: ${g} gold${extra}.`,'good');
}
function gainXp(n){
  S.xp+=n;
  while(S.xp>=S.lvl*35){S.xp-=S.lvl*35;S.lvl++;const g=CLASSES[S.cls].grow;S.maxHp+=g.hp;S.maxMp+=g.mp;S.atk+=g.atk;S.def+=1;S.hp=S.maxHp;S.mp=S.maxMp;
    say(`Level up! You are now level ${S.lvl}. You feel stronger, and your wounds close.`,'good');}
}
function win(){
  const f=S.foe,F=FOES[f.key];
  if(F.xp)say(`The ${f.name} falls. You gain ${F.xp} XP and ${F.gold} gold.`,'good');
  S.gold+=F.gold;gainXp(F.xp);S.foe=null;mode='explore';
  if(S.flags.pendingKey){S.flags.pendingKey=false;S.flags.key=true;say('You pry the rusted key from its bony fingers. It bears the sigil of the Sunken Chapel.','good');}
  if(F.boss)S.beaten[f.key]=1;
  if(F.ember){S.embers=F.ember;EMBER_TEXT[F.ember].forEach(t=>say(t,'good'));S.loc='village';
    if(S.heldTablet){S.tablet=S.heldTablet;S.heldTablet=0;say('Corwin the reeve is waiting by the lantern. He stares at the ember for a long moment, then hands back your tablet without a word. It still has its charge.','good');}
    say(`Round ${F.ember+1} of 9 begins. Speak to Elder Maren.`,'sys');}
  if(f.key==='king'){S.flags.done=true;mode='won';S.loc='village';
    say('Orlen staggers. The stolen voices tear free of him one by one, a rush of whispers that turns into laughter, then into silence. The Hollow King crumbles into dry leaves, and the hollow tree finally falls.','good');
    say(`Whisperwood is quiet for the first time in three centuries. In Hollowmere the lantern blazes white-gold, and the villagers fill the square, chanting the name ${esc(S.name)}. THE END.`,'good');}
}
function hurt(frac){const d=Math.min(S.hp-1,Math.ceil(S.maxHp*frac));S.hp-=d;return d;}
function startMob(){
  mode='event';
  say('As you step out of Maren\'s cottage, a group of teenagers in stiff black clothes and starched white collars spots your strange clothes and the glow of the tablet. One of them points and shrieks, "Demon, begone!"','hit');
  say('Villagers come running toward the commotion, and within minutes you are surrounded by a small mob. "Witch!" "Demon!" The crowd is working itself into a frenzy.');
  say('A broad-shouldered man in a leather jerkin pushes through and raises his hands, and the shouting dies down. He gives you a warm, easy smile, like a friend come to help. Then he speaks. "Grab him!"');
  const d=hurt(.45);
  say(`Three young men seize you and throw you to the ground. They kick you again and again for what feels like several minutes. Then they bind your wrists, gag you, and pull a rough hood over your head. Everything goes dark. (-${d} HP)`,'hit');
  S.loc='jail';
  say('When the hood is pulled off, you are sitting in a cold stone cell. Another poor soul sits slumped beside you, a thin man dressed in rags.');
  say('The jailer who removed your hood is the same smiling man. "This is just a taste of what we have in store for you," he says. "Who sent you? Was it Orlen?"','sys');
}
function release(){S.loc='village';mode='explore';say('You are free, but bruised and aching all over. A night at the inn would do you good.','sys');}
function mobChoice(c){
  if(c==='truth'){
    say('"Nobody sent me. I came through a door in my house, and I have never heard of anyone called Orlen."');
    const d=hurt(.2);
    say(`His smile disappears. "A door that leads out of nowhere. That is exactly what a demon would say." He nods to the young men, and the kicking starts again. (-${d} HP)`,'hit');
    if(!S.flags.tobinHint){S.flags.tobinHint=1;say('When they stop, the man in rags catches your eye and mouths a single word: "Maren."');}
    say('"I will ask you once more," the jailer says. "Who sent you?"','sys');
    return;
  }
  if(c==='maren'){
    say('"Elder Maren knows me. Ask her."');
    say('The jailer hesitates at her name, then sends a boy running. Soon Maren arrives, out of breath and furious. "This traveller is under my protection, Corwin! Untie them at once." Grumbling, Corwin the reeve cuts your ropes.');
    say('"Keep that demon-glass out of sight, stranger," he mutters. "Next time the elder might not come." Maren presses a Healing Draught into your hand and helps you to the door.','good');
    S.inv.potion++;
  }else{
    say('"I am not his servant. I came to bring back Aldra\'s flame."');
    say('Corwin studies you for a long moment, then pulls the tablet from your belt. "Then prove it. I will keep your demon-glass until the lantern burns again. Run, and we will hunt you down." He cuts your ropes and shoves you out into the street.','sys');
    S.heldTablet=S.tablet;S.tablet=0;
  }
  say('As the cell door closes behind you, the man in rags whispers, "If you ever find the Hollow King, tell him Tobin still remembers." You have no idea what he means.');
  release();
}
function flashTablet(){
  if(!(S.tablet>0))return;S.tablet--;S.foe.dazzled=true;
  say(`You hold up the tablet and turn the screen to full brightness. A blinding white glare fills the air, and the ${S.foe.name} reels back, dazzled!`,'good');
  if(!S.tablet)say('The screen flickers and goes black. The battery is dead.','sys');
  foeTurn();
}
function foeTurn(){
  const f=S.foe,F=FOES[f.key];S.turn++;
  if(f.dazzled){f.dazzled=false;say(`The ${f.name} stumbles about, still blinking, and cannot attack.`);return;}
  if(f.key==='king'&&!f.enraged&&f.hp<=f.max/2){f.enraged=true;f.atk+=12;say('The Hollow King howls and draws the forest\'s darkness into himself. His blows grow heavier!','hit');}
  if(f.key==='king'&&!f.healed&&f.hp<=f.max*.3){f.healed=true;const h=Math.round(f.max*.2);f.hp+=h;say(`Orlen tears warmth from the stolen voices around him and drinks it in. His wounds close (+${h} HP)! But the voices are thinning. He cannot do that again.`,'hit');return;}
  if(S.cls==='rogue'&&Math.random()<.2){say(`You slip aside as the ${f.name} strikes at empty air.`);return;}
  let d=Math.max(1,f.atk+rnd(0,2)-S.def),msg=`The ${f.name} hits you for ${d}.`;
  if(F.boss&&S.turn%3===0){d=Math.round(d*1.6);msg=`${f.name} uses ${F.special} for ${d} damage!`;}
  S.hp-=d;say(msg,'hit');
  if(S.hp<=0){S.hp=0;mode='dead';say('Darkness takes you.','hit');}
}
function strike(mult,label){
  const f=S.foe;let d=Math.max(1,Math.round((S.atk+rnd(0,3))*mult)-f.def);
  const crit=S.cls==='rogue'&&Math.random()<(label==='Backstab'?.5:.2);if(crit)d*=2;
  f.hp-=d;say(`${label?label+'! ':''}You ${crit?'land a critical blow':'strike'} for ${d}.`);
  if(f.hp<=0)win();else foeTurn();
}
function skill(){
  const c=CLASSES[S.cls];if(S.mp<c.cost)return;S.mp-=c.cost;
  if(S.cls==='mage'){const d=rnd(14,20)+S.lvl*5;S.foe.hp-=d;say(`Firebolt! Flame engulfs the ${S.foe.name} for ${d}.`);if(S.foe.hp<=0)win();else foeTurn();}
  else strike(S.cls==='warrior'?2:1.3,c.skill);
}
function use(id){
  if(!S.inv[id])return;S.inv[id]--;const [n,amt,stat]=ITEMS[id];
  if(stat==='hp'){const h=Math.min(amt,S.maxHp-S.hp);S.hp+=h;say(`You drink a ${n} (+${h} HP).`,'good');}
  else{const m=Math.min(amt,S.maxMp-S.mp);S.mp+=m;say(`You drink ${n} (+${m} MP).`,'good');}
  if(mode==='items-combat'){mode='combat';foeTurn();}else mode='explore';
}
function flee(){
  if(FOES[S.foe.key].boss){say('There is no escape from this fight.','hit');return foeTurn();}
  if(Math.random()<.55){say('You break away and escape into the dark.');S.foe=null;mode='explore';}
  else{say('You try to flee but stumble!','hit');foeTurn();}
}
function buy(it){
  if(S.gold<it.price)return say(`"Come back when you have ${it.price} gold," says the smith.`);
  S.gold-=it.price;
  if(it.once){if(S.gear[it.id])return;S.gear[it.id]=1;S.atk+=it.atk||0;S.def+=it.def||0;}else S.inv[it.id]++;
  say(`You buy the ${it.name}.`,'good');
}

/* ---------- actions ---------- */
function actions(){
  const A=[],c=CLASSES[S.cls],e=S.embers;
  const add=(label,fn,sub='',o={})=>A.push({label,fn,sub,...o});
  const inv=[['potion','draught'],['greater','greater'],['elixir','elixir'],['ether','ether'],['deep','deep ether']].filter(([k])=>S.inv[k]||k==='potion').map(([k,n])=>`${S.inv[k]||0} ${n}`).join(', ');
  if(mode==='event'){
    add('Ask them to fetch Elder Maren',()=>mobChoice('maren'),'Someone here might vouch for you');
    add("Swear you're here to bring back the flame",()=>mobChoice('swear'),'Give him your word');
    add('Tell him the truth',()=>mobChoice('truth'),'You came through a door in your house');
    return A;}
  if(mode==='dead'){add('Rise again',()=>{S.hp=Math.ceil(S.maxHp/2);S.mp=S.maxMp;S.gold=Math.floor(S.gold/2);S.foe=null;S.loc='village';mode='explore';say('You wake in the village temple, half your gold gone to the priests.','sys');},'Back to the village, lose half your gold',{main:1});return A;}
  if(mode==='won'){add('Keep adventuring',()=>{mode='explore';say('The woods are quieter now, but not empty.','sys');},'',{main:1});add('Start a new tale',reset);return A;}
  if(mode==='combat'){
    add('Attack',()=>strike(1,''),`${S.atk} attack`,{main:1});
    add(c.skill,skill,`${c.cost} MP`,{dis:S.mp<c.cost});
    add('Items',()=>{mode='items-combat'},inv);
    add('Flee',flee,FOES[S.foe.key].boss?'Impossible':'55% chance');
    if(S.tablet>0)add('Flash the tablet',flashTablet,`Dazzles the enemy for a turn · ${S.tablet} charge${S.tablet>1?'s':''} left`);
    return A;}
  if(mode==='items'||mode==='items-combat'){
    Object.entries(ITEMS).forEach(([id,[n,amt,st]])=>add(n,()=>use(id),`${S.inv[id]} left · +${amt} ${st.toUpperCase()}`,{dis:!S.inv[id]}));
    add('Back',()=>{mode=mode==='items-combat'?'combat':'explore'});return A;}
  if(mode==='travel'){
    ROUNDS.forEach((R,i)=>{if(i>e+1)return;
      const locked=i===0?!S.flags.key:i>e,last=i===8;
      const why=i===0?'Locked: needs the rusted key':last?`Hidden: needs all ${EMBERS} embers`:`Needs ${i} ember${i>1?'s':''}`;
      add(PLACES[R.loc].name,()=>{mode='explore';travel(R.loc);},locked?why:`Round ${i+1}${S.beaten[R.boss]?' · cleared':''} · level ${R.lvl}+`,{dis:locked});});
    add('Stay in Whisperwood',()=>{mode='explore'});return A;}
  if(mode==='shop'){
    SHOP.filter(it=>it.req<=e&&!(it.once&&S.gear[it.id])).forEach(it=>add(`${it.name} · ${it.price}g`,()=>buy(it),it.note));
    add('Leave the forge',()=>{mode='explore'});return A;}
  const l=S.loc,need=(n)=>S.lvl<n?`Recommended level ${n}`:'';
  if(l==='village'){
    add('Talk to Elder Maren',talk,S.flags.quest?'':'She looks worried',{main:!S.flags.quest});
    const inn=S.flags.garb?3:5;
    add('Rest at the inn',()=>{if(S.gold<inn)return say(`"${inn===3?'Three':'Five'} gold a night," says the innkeeper, unmoved.`);S.gold-=inn;S.hp=S.maxHp;S.mp=S.maxMp;say(inn===3?'The innkeeper gives a local the good spot by the fire. You wake fully restored.':'The innkeeper eyes your strange clothes and charges you the stranger\'s rate. Still, you sleep by the fire at the Gilded Goose and wake fully restored.','good');},`${inn} gold · full heal`);
    const newGear=SHOP.some(it=>it.once&&it.req<=e&&!S.gear[it.id]);
    add("Visit the smith's forge",()=>{mode='shop';say(!newGear?'"You\'ve got the best I can make for now," Brannoc says. "Bring back another ember and I\'ll forge you something finer. I still have potions, though."':e?'"Your embers lit my old forge too," Brannoc grins. "I can make finer things now."':'Brannoc the smith wipes soot from his hands. "Buying?"')},newGear?(e?'New gear available':''):'Potions only for now');
    add('Walk to Whisperwood',()=>travel('forest'),'',{main:S.flags.quest});
  }else if(l==='forest'){
    add('Explore the woods',explore,'Danger and treasure',{main:1});
    add('Enter Mossdeep Cave',()=>travel('cave'),need(2));
    add('Travel beyond Whisperwood',()=>{mode='travel'},S.flags.key?`Round ${Math.min(e+1,9)} of 9`:'The chapel is locked: find the key');
    add('Return to the village',()=>travel('village'));
  }else if(l==='cave'){
    add('Delve deeper',explore,S.flags.key?'':'Something waits below',{main:1});
    add('Leave the cave',()=>travel('forest'));
  }else{
    const R=ROUNDS.find(x=>x.loc===l);
    add(R.explore,explore,need(R.lvl)||'Strong foes',{main:1});
    if(!S.beaten[R.boss])add(R.fight,()=>fight(R.boss),`${FOES[R.boss].final?'Final boss':'Boss'} · level ${R.blvl}+ advised`);
    add('Retreat to Whisperwood',()=>travel('forest'));
  }
  add('Inventory',()=>{mode='items'},inv);
  return A;
}

/* ---------- help ---------- */
function helpHtml(){
  const cl=Object.values(CLASSES).map(c=>`<tr><td><b>${c.label}</b></td><td class="n">${c.hp}</td><td class="n">${c.mp}</td><td class="n">${c.atk}</td><td class="n">${c.def}</td><td>${c.skill} (${c.cost} MP)</td></tr>`).join('');
  const row=f=>`<tr><td><b>${f.name}</b></td><td>${f.where}</td><td class="n">${f.hp}</td><td class="n">${f.atk}</td><td class="n">${f.def}</td><td class="n">${f.xp}</td><td class="n">${f.gold}</td></tr>`;
  const head='<thead><tr><th>Name</th><th>Found in</th><th class="n">HP</th><th class="n">Atk</th><th class="n">Def</th><th class="n">XP</th><th class="n">Gold</th></tr></thead>';
  const fo=Object.values(FOES).filter(f=>!f.boss).map(row).join(''),bo=Object.values(FOES).filter(f=>f.boss).map(row).join('');
  const sh=SHOP.map(i=>`<tr><td>${i.name}</td><td class="n">${i.price}g</td><td>${i.note}${i.once?' (buy once)':''}</td><td>${i.req?`After ${i.req} ember${i.req>1?'s':''}`:'From the start'}</td></tr>`).join('');
  return `<h2 id="helpt">How to play<button type="button" id="helpclose" aria-label="Close guide">Close</button></h2>
  <p>Recover the eight embers of Aldra's flame, then defeat the Hollow King and relight the lantern of Hollowmere. Tap the buttons to act. The highlighted button is usually the next good step.</p>
  <h3>The quest, round by round</h3>
  <p>Talk to Elder Maren, then train in Whisperwood and Mossdeep Cave. After three trips into the cave you'll meet the skeleton guarding the rusted key, which opens the Sunken Chapel. From then on, use <b>Travel beyond Whisperwood</b> to reach each round's area.</p>
  <ol>${ROUNDS.map(R=>`<li><b>${PLACES[R.loc].name}</b> (level ${R.lvl}+): defeat ${FOES[R.boss].name} (level ${R.blvl}+)${FOES[R.boss].ember?` for ember ${FOES[R.boss].ember}`:', the final boss'}.</li>`).join('')}</ol>
  <p>Each boss holds one of the eight embers of Aldra's flame. Every ember you bring home opens the next area, gives Maren new advice and unlocks better gear at the forge. Upgrading your weapon and armour matters a lot.</p>
  <h3>Your first choice</h3>
  <ul><li><b>Trade the tablet for village clothes:</b> you blend in, so the inn costs only 3 gold, and Maren adds a free Healing Draught.</li><li><b>Keep the tablet:</b> in combat, <b>Flash the tablet</b> dazzles any enemy, even a boss, so it loses its next attack. The battery has 3 charges and can't be recharged. But some villagers distrust strangers, and that can get you into trouble.</li></ul>
  <h3>Classes</h3>
  <div class="scroll"><table><thead><tr><th>Class</th><th class="n">HP</th><th class="n">MP</th><th class="n">Atk</th><th class="n">Def</th><th>Skill</th></tr></thead><tbody>${cl}</tbody></table></div>
  <ul><li><b>Cleave</b> (Warrior): an attack at double strength.</li><li><b>Firebolt</b> (Mage): 14–20 damage plus 5 per level, and it ignores enemy defence.</li><li><b>Backstab</b> (Rogue): a stronger hit with a 50% chance to crit.</li><li><b>Rogues</b> dodge 20% of enemy attacks, and their normal attacks have a 20% chance to crit. A crit does double damage.</li></ul>
  <h3>Combat</h3>
  <ul><li><b>Attack:</b> your attack plus 0–3, minus the enemy's defence. Always at least 1 damage.</li><li><b>Items:</b> drinking a potion uses up your turn.</li><li><b>Flee:</b> 55% chance to escape. If you fail, the enemy gets a free hit. You can't flee from bosses.</li><li><b>Enemy hits:</b> their attack plus 0–2, minus your defence.</li><li><b>Bosses</b> use a special attack every third turn for about 1.6 times normal damage.</li><li><b>The Hollow King</b> is much tougher than any other boss. At half health he grows stronger (+12 attack), and once he drops below 30% he heals 20% of his health one time. Bring plenty of Elixirs.</li><li><b>If you fall</b>, you wake in the village with half HP and lose half your gold.</li></ul>
  <h3>Gold and XP</h3>
  <ul><li>You start with 15 gold, 2 Healing Draughts and 1 Blue Ether.</li><li>Every enemy you defeat gives a fixed amount of XP and gold (see the tables below).</li><li>Exploring sometimes finds treasure instead of a fight. Each new area has richer treasure, and later areas also hide Greater Draughts and Elixirs of Aldra.</li><li><b>Levelling up</b> takes your level × 35 XP and fully restores you. Each level gives +1 defence plus: Warriors +7 max HP, +2 MP, +2 attack; Mages +8 HP, +5 MP, +1 attack; Rogues +6 HP, +3 MP, +2 attack.</li></ul>
  <h3>Enemies</h3>
  <div class="scroll"><table>${head}<tbody>${fo}</tbody></table></div>
  <h3>Bosses</h3>
  <div class="scroll"><table>${head}<tbody>${bo}</tbody></table></div>
  <h3>Village</h3>
  <ul><li><b>Gilded Goose inn:</b> restores all HP and MP. It costs 5 gold, or 3 if you traded for village clothes.</li><li><b>Brannoc's forge</b> stocks better gear as you return embers. Weapons and armour can be bought once each, and their bonuses add together. Once you own one, it no longer appears in his list.</li></ul>
  <div class="scroll"><table><thead><tr><th>Item</th><th class="n">Price</th><th>Effect</th><th>Available</th></tr></thead><tbody>${sh}</tbody></table></div>
  <h3>Saving</h3>
  <p>The game saves after every action, in this browser only. <b>New game</b> erases your save.</p>`;
}
function openHelp(){$('helpbody').innerHTML=helpHtml();$('help').hidden=false;$('helpclose').focus();}
function closeHelp(){$('help').hidden=true;$('helpbtn').focus();}

/* ---------- render ---------- */
let acts=[];
function render(){
  scene();
  if(mode==='door'){
    $('ui').innerHTML=`<div class="intro">
      <p>You moved into the old house three weeks ago, and you still haven't finished unpacking. Boxes line the hallway. At the far end, past the linen closet, is a narrow wooden door you have never opened. The realtor said it was only storage. Nobody could find the key.</p>
      <p>Tonight, with rain drumming on the windows, you notice a thin line of warm orange light glowing under that door.</p>
      <p>You try the handle. It turns easily, as if it had been waiting for you. Behind the door there is no closet, only a stone staircase spiralling down, much deeper than the house could possibly go. The air smells of pine needles and woodsmoke. Far below, voices are whispering.</p>
      <p>You start down the stairs. When you look back, the door is gone.</p>
      <p>At the bottom you step out into cold night air. You are standing at the edge of a village of thatched cottages. Above the square hangs a great iron lantern, dark and empty. An old woman in a grey shawl is watching you, as if she has been expecting someone.</p>
      <p class="who">"Another one through Aldra's door," she says quietly. "Then you had better hear the old story."</p>
      <button class="main" type="button" data-i="offer">Continue</button></div>`;
    return;
  }
  if(mode==='offer'){
    const reply=trade==='garb'
      ?`<p>You hand over the tablet. Maren turns it over in her fingers, peering at the pictures as they slide past, then tucks it carefully inside her shawl. In return she gives you a rough wool tunic, a cloak and sturdy boots. They fit as if they were made for you.</p><p class="who">"There," she says. "Now you look like one of us. People will be kinder to you for it."</p>`
      :trade==='keep'?`<p>You hold the tablet a little tighter. Maren shrugs, though her eyes linger on its glow.</p><p class="who">"As you like. But people here will stare, and some will charge you the stranger's price. Keep that light close. A glow like that might startle more than villagers."</p>`:'';
    $('ui').innerHTML=`<div class="intro">
      <p>The old woman walks up to you and looks you over, from your strange shoes to the glowing tablet in your hand. The pictures on its screen are still moving.</p>
      <p class="who">"I am Maren, elder of this village. You cannot walk about Hollowmere dressed like that. Folk will think you are a spirit out of the wood." She opens the bundle under her arm. "I have plain clothes here that will let you pass for one of us. In return, I would like that magic tablet with the pictures in it."</p>
      ${trade?reply+`<button class="main" type="button" data-i="intro">Listen to her story</button>`
        :`<div class="acts"><button type="button" data-t="garb">Trade the tablet for the clothes<small>Blend in: cheaper inn and a free Healing Draught</small></button><button type="button" data-t="keep">Keep the tablet<small>Stand out, but its glow can dazzle enemies 3 times</small></button></div>`}
    </div>`;
    return;
  }
  if(mode==='intro'){
    $('ui').innerHTML=`<div class="intro">
      <p>Long ago, before there was a village, there was only the forest, and the forest had a king. Orlen was a mortal lord who feared death more than anything. So he went into the deepest grove and made a bargain with the old spirits of the wood: he gave them his heart, and in return they promised he would never die.</p>
      <p>They kept their word. Orlen did not die. But a man with no heart has no warmth, and soon he began taking it from others. Hunters, travellers and children who wandered too far went into the trees and never came out. Their voices stayed behind, caught in the branches. That is why the forest whispers, and why people began to call it <b>Whisperwood</b>, and to call its master <b>the Hollow King</b>.</p>
      <p>Three hundred years ago a lantern-keeper named Aldra walked into the woods carrying a flame she had lit from her own heart. The Hollow King could not stand its light. She drove him back into his chapel, sank it into the marsh, and locked the door behind him. She built a village at the forest's edge and hung her flame in a great lantern above the square. As long as it burns, the trees cannot move forward and the King cannot leave.</p>
      <p>Three nights ago the lantern went out.</p>
      <p class="who">Since then the whispers have grown louder, and every morning the forest stands a little closer to Hollowmere.</p>
      <button class="main" type="button" data-i="create">Take up the quest</button></div>`;
    return;
  }
  if(mode==='create'){
    $('ui').innerHTML=`<form class="create" id="cf"><p>Choose who will bring back the flame.</p>
      <label for="nm">Your name</label><input id="nm" maxlength="20" placeholder="Wanderer" autocomplete="off">
      <div class="classes">${Object.entries(CLASSES).map(([k,c])=>`<button type="button" data-c="${k}" aria-pressed="${k===chosen}">${c.label}<small>${c.hp} HP · ${c.mp} MP · ${c.blurb}</small></button>`).join('')}</div>
      <button class="main" type="submit">Begin the adventure</button></form>`;
    return;
  }
  const c=CLASSES[S.cls],ch=S.flags.done?'Complete':`Round <b>${Math.min(S.embers+1,9)}</b>/9`;
  $('ui').innerHTML=`<div class="vit">${barHtml('HP',S.hp,S.maxHp,'var(--hp)')}${barHtml('MP',S.mp,S.maxMp,'var(--mp)')}${barHtml('XP',S.xp,S.lvl*35,'var(--xp)')}</div>
    <div class="meta"><span><b>${esc(S.name)}</b>, ${c.label}</span><span>Level <b>${S.lvl}</b></span><span>Gold <b>${S.gold}</b></span><span>Atk <b>${S.atk}</b></span><span>Def <b>${S.def}</b></span><span>Embers <b>${S.embers}/${EMBERS}</b></span><span>${ch}</span>${S.flags.key&&!S.embers?'<span>Rusted key</span>':''}</div>
    <div class="log" id="log" aria-live="polite">${log.map(e=>`<p class="${e.c}">${e.t}</p>`).join('')}</div>
    <div class="acts">${(acts=actions()).map((a,i)=>`<button type="button" data-a="${i}" class="${a.main?'main':''}" ${a.dis?'disabled':''}>${a.label}${a.sub?`<small>${a.sub}</small>`:''}</button>`).join('')}</div>`;
  const lg=$('log');lg.scrollTop=lg.scrollHeight;
}
function reset(){try{localStorage.removeItem(KEY)}catch(e){}S=null;log=[];trade=null;mode='door';render();}

$('ui').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){trade=b.dataset.t;render();return;}
  if(b.dataset.i){mode=b.dataset.i;render();window.scrollTo(0,0);return;}
  if(b.dataset.c){chosen=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.c===chosen));return;}
  if(b.dataset.a){const a=acts[+b.dataset.a];if(a&&!a.dis){a.fn();save();render();}}
});
$('ui').addEventListener('submit',e=>{e.preventDefault();newHero($('nm').value.trim(),chosen);save();render();});
$('reset').addEventListener('click',reset);
$('helpbtn').addEventListener('click',openHelp);
$('help').addEventListener('click',e=>{if(e.target.id==='help'||e.target.id==='helpclose')closeHelp();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('help').hidden)closeHelp();});

load();render();
}
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
